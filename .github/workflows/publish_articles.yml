name: Publish Articles to Qiita

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish_articles.yml"
      - "article-map.json"
      - "package.json"
      - "package-lock.json"
      - "pre-publish/**"
      - "qiita.config.json"
      - "scripts/**"
      - "test/**"

permissions:
  contents: read

concurrency:
  group: qiita-publish-main
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Validate Immutable Bindings
        env:
          BASELINE_REF: ${{ github.event.before }}
        run: npm run validate:map-history -- --baseline-ref "$BASELINE_REF"

      - name: Prepare Clean Pull Baseline
        run: npm run prepare:pull

      - name: Pull Bound Targets from Qiita
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_REPO_TOKEN }}
        run: npx qiita pull --force

      - name: Validate Manifest, Sources, Map, and Pulled Targets
        run: npm run validate

      - name: Build, Diff, and Publish Changed Bound Targets
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_REPO_TOKEN }}
        run: npm run release:bound
